name: Deploy Landing to Amplify

# 랜딩 페이지 배포 (2026-08-30).
#
# 랜딩은 본 서비스(Next.js)와 별도 Amplify 앱이다. 정적 HTML 한 장이라 빌드가
# 없고, 같은 앱에 넣으면 앱 레벨 설정(AMPLIFY_MONOREPO_APP_ROOT)을 브랜치마다
# 덮어써야 해서 분리했다.
#
# 그 앱은 Git 연결이 안 돼 있어 **수동 배포(create-deployment → 업로드 →
# start-deployment)** 만 가능하다. 그래서 여기서 대신 해준다. 이걸 만들기 전에는
# 파일을 고쳐 커밋해도 사이트에 반영되지 않았다.
#
#   main 푸시 → 미리보기 (GA4 집계 안 함)
#   prod 푸시 → 실서비스 (GA4 집계함)

on:
  push:
    branches: [main, prod]
    paths:
      - 'auto_video_create_landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      AMPLIFY_APP_ID: d2e5z3dwxc0id4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package landing
        run: |
          cd auto_video_create_landing
          zip -r ../landing.zip . -x "*.DS_Store"
          cd ..
          ls -l landing.zip

      - name: Deploy to Amplify
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"
          echo "대상 브랜치: $BRANCH"

          # 배포 슬롯을 받고 → zip 을 올리고 → 배포를 시작한다.
          # 세 단계가 한 세트라 중간에 실패하면 슬롯만 남고 배포는 안 된다.
          aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$BRANCH" \
            --region "$AWS_REGION" --output json > deployment.json

          JOB_ID=$(python3 -c "import json;print(json.load(open('deployment.json'))['jobId'])")
          UPLOAD_URL=$(python3 -c "import json;print(json.load(open('deployment.json'))['zipUploadUrl'])")
          echo "jobId=$JOB_ID"

          curl -sf -X PUT -T landing.zip "$UPLOAD_URL"

          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
            --region "$AWS_REGION" > /dev/null

          # 성공을 확인하고 끝낸다. 시작만 하고 끝내면 실패해도 초록불이 뜬다.
          for i in $(seq 1 40); do
            STATUS=$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" --branch-name "$BRANCH" --job-id "$JOB_ID" \
              --region "$AWS_REGION" --query 'job.summary.status' --output text)
            echo "  status=$STATUS"
            case "$STATUS" in
              SUCCEED) echo "배포 완료: https://${BRANCH}.${AMPLIFY_APP_ID}.amplifyapp.com"; exit 0 ;;
              FAILED|CANCELLED) echo "배포 실패 ($STATUS)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "시간 초과 — Amplify 콘솔에서 확인 필요"
          exit 1
